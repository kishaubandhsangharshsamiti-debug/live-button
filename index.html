<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:transparent;
}

.liveYoutube-btn{

    display:flex;
    align-items:center;
    gap:14px;

    padding:12px 28px;

    background:#FF0000;

    color:#fff;

    text-decoration:none;

    border-radius:50px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:26px;

    font-weight:bold;

    box-shadow:0 0 15px rgba(255,0,0,.6);

    animation:pulse 1.2s infinite;

    transition:.3s;

}

.liveYoutube-btn:hover{

    transform:scale(1.05);

}

/* YouTube Logo */

.logo{

    width:42px;

    height:30px;

    background:#fff;

    border-radius:8px;

    position:relative;

    flex-shrink:0;

}

.logo:before{

    content:"";

    position:absolute;

    left:15px;

    top:7px;

    width:0;

    height:0;

    border-top:8px solid transparent;

    border-bottom:8px solid transparent;

    border-left:13px solid #FF0000;

}

/* LIVE Dot */

.liveYoutube-dot{

    width:14px;

    height:14px;

    background:#fff;

    border-radius:50%;

    box-shadow:0 0 10px #fff;

    animation:blink .8s infinite;

}

.text{

    display:flex;

    align-items:center;

    gap:10px;

}

@keyframes blink{

    0%,100%{

        opacity:1;

        transform:scale(1);

    }

    50%{

        opacity:.2;

        transform:scale(.6);

    }

}

@keyframes pulse{

    0%{

        box-shadow:0 0 10px rgba(255,0,0,.5);

    }

    50%{

        box-shadow:0 0 35px rgba(255,0,0,1);

    }

    100%{

        box-shadow:0 0 10px rgba(255,0,0,.5);

    }

}

</style>

</head>

<body>

<a class="liveYoutube-btn"
href="https://www.youtube.com/@KishauBandhSangharshSamiti"
target="_blank">

<div class="logo"></div>

<div class="text">

<div class="liveYoutube-dot"></div>

<div>LIVE YouTube</div>

</div>

</a>

</body>
</html>
