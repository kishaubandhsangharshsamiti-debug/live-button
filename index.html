<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIVE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:transparent;
font-family:Arial,Helvetica,sans-serif;
}

.live-btn{

display:inline-flex;
align-items:center;
gap:12px;

padding:10px 24px;

background:#ffffff;

border:3px solid #111;

border-radius:40px;

text-decoration:none;

color:#111;

font-size:22px;

font-weight:700;

box-shadow:0 5px 12px rgba(0,0,0,.25);

transition:.3s;

}

.live-btn:hover{

transform:scale(1.06);

box-shadow:0 8px 18px rgba(0,0,0,.35);

}

.live-dot{

width:18px;
height:18px;

background:#ff0000;

border-radius:50%;

animation:blink 1s infinite;

}

@keyframes blink{

0%{
opacity:1;
box-shadow:0 0 0 0 rgba(255,0,0,.8);
}

50%{
opacity:.3;
box-shadow:0 0 0 12px rgba(255,0,0,0);
}

100%{
opacity:1;
box-shadow:0 0 0 0 rgba(255,0,0,.8);
}

}

</style>

</head>

<body>

<a class="live-btn"
href="https://www.youtube.com/@KishauBandhSangharshSamiti"
target="_blank">

<span class="live-dot"></span>

LIVE

</a>

</body>
</html>
